name: iOS runtime without game content

# Builds the iPhone / iPad executable of Tears of the Kingdom 1.4.3 from this repository alone
# (games/totk/ios/tools/build_ipa.py --runtime-only). The game's code sections are zero-filled to the sizes in
# games/totk/ios/ci/embed-layout-v143.json and the executable carries its hashes; that layout was written with
# gen_embed.py --layout-of from the sections games/totk/ios/tools/export_ios_windows.py exports on Windows: the pinned
# 1.4.3 rewrites with the game patches of games/totk/runtime/game_patches_v143.c as of upstream f1d0077 written in (an
# app built at 30a1b93 lacks two of them in main's text, the fade-counter fix and the render-resolution patch). A change
# to the words those patches write needs a new export and the layout written again from it. The machine that holds the
# game files writes the sections into the executable, adds the game data and signs the app. TOTK-runtime.zip holds
# TOTK.app and beside it TOTK-runtime.commit, the commit the run built (github.sha), which package_ipa_windows.py takes as
# the app's TOTKSourceCommit.

on:
  push:
    branches: [ios-windows-fixes]
    paths: ['games/totk/**', '.github/workflows/ios-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Show the Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build the runtime app
        run: >
          python games/totk/ios/tools/build_ipa.py --tree games/totk --version v143 --runtime-only
          --embed-layout games/totk/ios/ci/embed-layout-v143.json
          --out "$RUNNER_TEMP/TOTK.app" --logs "$RUNNER_TEMP/logs"
      - name: Pack the app with the commit it was built from
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/runtime"
          mv "$RUNNER_TEMP/TOTK.app" "$RUNNER_TEMP/runtime/"
          printf '%s\n' "$SOURCE_COMMIT" > "$RUNNER_TEMP/runtime/TOTK-runtime.commit"
          ditto -c -k "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/TOTK-runtime.zip"
          python -I - "$RUNNER_TEMP/TOTK-runtime.zip" "$SOURCE_COMMIT" <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'games/totk/ios/tools')
          import package_ipa_windows
          named = package_ipa_windows.runtime_commit(Path(sys.argv[1]))
          sys.exit(None if named == sys.argv[2] else f'{sys.argv[1]} names {named}, not {sys.argv[2]}')
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: totk-ios-runtime
          path: ${{ runner.temp }}/TOTK-runtime.zip
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: totk-ios-runtime-logs
          path: ${{ runner.temp }}/logs
          retention-days: 14
