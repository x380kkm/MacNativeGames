name: iOS runtime without game content

# Builds the iPhone / iPad executable of Tears of the Kingdom 1.4.3 from this repository alone
# (games/totk/ios/tools/build_ipa.py --runtime-only). The game's code sections are zero-filled to the sizes in
# games/totk/ios/ci/embed-layout-v143.json and the executable carries its hashes; that layout was written with
# gen_embed.py --layout-of from the sections of an app built at 30a1b93 (the pinned 1.4.3 rewrites as that build's
# export left them). The machine that holds the game files writes the sections into the executable, adds the game data
# and signs the app.

on:
  push:
    branches: [ios-windows-fixes]
    paths: ['games/totk/**', '.github/workflows/ios-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Show the Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build the runtime app
        run: >
          python games/totk/ios/tools/build_ipa.py --tree games/totk --version v143 --runtime-only
          --embed-layout games/totk/ios/ci/embed-layout-v143.json
          --out "$RUNNER_TEMP/TOTK.app" --logs "$RUNNER_TEMP/logs"
      - name: Pack the app
        run: ditto -c -k --keepParent "$RUNNER_TEMP/TOTK.app" "$RUNNER_TEMP/TOTK-runtime.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: totk-ios-runtime
          path: ${{ runner.temp }}/TOTK-runtime.zip
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: totk-ios-runtime-logs
          path: ${{ runner.temp }}/logs
          retention-days: 14
